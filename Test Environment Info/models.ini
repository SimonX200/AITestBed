# ==========================================
# GLOBALE STANDARDS (Gilt für alle Modelle)
# ==========================================
[*]
host = 0.0.0.0

load-mode = mmap+mlock
lazy-mode = off
parallel = 1
threads = 12

# Continuous Batching & Context Shift

# OPTIMIERT: Spart Overhead bei Single-User/Single-Slot
kv-unified = true          
flash-attn = true


# OPTIMIERT FÜR VRAM-EINSPARUNG BEIM PREFILL
batch-size = 4096            # Reduziert von 4096 (senkt den logischen Overhead)
ubatch-size = 512            # Reduziert von 1024 -> Das spart ~1 GB Spitzen-VRAM!

jinja = true
reasoning-format = deepseek
reasoning-effort = xhigh
reasoning-preserve = on
cache-prompt = true
cont-batching = true
context-shift = true


# ==========================================
# EINZELNE MODELLE (Der Name in [] ist die API-ID)
