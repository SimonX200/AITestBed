version: '3.8'

services:
  session-manager:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "${EXAMPLE_SESSIONMANAGER_PORT:-3000}:3000"
    environment:
      - EXAMPLE_SESSIONMANAGER_PORT=3000
      - PORT=3000
    volumes:
      - ../data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  data:
